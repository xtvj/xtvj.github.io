name = "xtvj-post-views"
main = "index.js"
compatibility_date = "2026-09-15"

[vars]
ALLOWED_ORIGIN = "https://xtvj.github.io"

[[d1_databases]]
binding = "DB"
database_name = "xtvj-post-views"
database_id = "0807e227-d0a3-431d-8f91-3082d675abc7"

[[ratelimits]]
name = "COMMENT_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "VIEW_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

[triggers]
crons = ["0 4 * * *"]
